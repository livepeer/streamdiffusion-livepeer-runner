name: build

# Builds the app image so an orchestrator can pull and run it; amd64 only, since
# Livepeer GPU work is NVIDIA/amd64.
#
# This image is ~15 GB (torch, TensorRT, ONNX Runtime), so it does not
# fit a GitHub-hosted runner as shipped: the job reclaims disk first, skips the
# layer cache (an image this size would blow the 10 GB Actions cache anyway), and does
# not run on pull requests, where a build this size buys little for what it costs.
#
# GHCR needs no stored credentials: the built-in GITHUB_TOKEN publishes, and the
# package is public, so pulling needs none either. Docker Hub is deliberately not
# a second target: livepeer/ there is a curated product namespace, and this is an
# example.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publishing to ghcr.io
    steps:
      - uses: actions/checkout@v7

      # A stock runner has roughly 25 GB free, which this image plus its build
      # layers still crowds.
      # These are preinstalled toolchains the build never touches; dropping them
      # frees about 25 GB more.
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules \
            "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Owner comes from the repo, so a fork publishes under its own namespace.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
